<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok callback</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0e0f12; color:#e8e6e1; font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:24px; box-sizing:border-box; }
  .card { max-width:560px; width:100%; background:#171a20; border:1px solid #262b35;
    border-radius:14px; padding:30px 32px; }
  h1 { margin:0 0 6px; font-size:19px; font-weight:600; }
  h1.ok { color:#3fb6a8; } h1.bad { color:#e05555; }
  p { color:#8b93a1; margin:10px 0; }
  code { display:block; word-break:break-all; background:#0b0c0f; border:1px solid #262b35;
    border-radius:8px; padding:12px 14px; margin-top:14px; color:#d9a441;
    font:12.5px/1.5 ui-monospace,Menlo,monospace; user-select:all; }
  button { margin-top:16px; background:#d9a441; color:#1a1405; border:0; border-radius:8px;
    padding:10px 18px; font:600 13px/1 inherit; cursor:pointer; }
  button:active { transform:translateY(1px); }
  .small { font-size:12px; color:#5e6672; margin-top:18px; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Receiving authorisation…</h1>
  <p>Hold on a moment.</p>
</div>
<script>
// TikTok redirects here with ?code=...&state=...
//
// GitHub Pages is static, so it cannot exchange the code for a token. Instead
// it hands the code to the Connect app running on the user's Mac, which is
// listening on port 8787. That local server does the actual token exchange
// with the client secret, which never leaves the machine.
const LOCAL = 'http://127.0.0.1:8787/tiktok/';

function show(title, cls, body) {
  document.getElementById('card').innerHTML =
    `<h1 class="${cls}">${title}</h1>${body}`;
}

(async () => {
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  const state = q.get('state');
  const error = q.get('error');
  const desc = q.get('error_description');

  if (error) {
    show('TikTok rejected the request', 'bad',
      `<p>${desc || error}</p><p class="small">You can close this tab.</p>`);
    return;
  }
  if (!code) {
    show('No authorisation code', 'bad',
      `<p>TikTok did not send a code. Start the connection again from your terminal.</p>`);
    return;
  }

  // Pass straight through to the local listener, preserving both values.
  const target = `${LOCAL}?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;

  let ok = false;
  try {
    const r = await fetch(target, { mode: 'no-cors', cache: 'no-store' });
    ok = true;   // opaque response under no-cors, so reaching here is the signal
  } catch (e) {
    ok = false;
  }

  if (ok) {
    show('TikTok connected', 'ok',
      `<p>Your Mac has the code and is finishing setup. You can close this tab.</p>
       <p class="small">If the terminal says it is still waiting, copy the code below into it:</p>
       <code>${code}</code>`);
    // Give the local server a moment to complete, then close if allowed.
    setTimeout(() => { try { window.close(); } catch (e) {} }, 2500);
  } else {
    show('Could not reach your Mac', 'bad',
      `<p>This page could not talk to the local button listener. Make sure
       <code style="display:inline;padding:1px 5px;margin:0">bash tools/tiktok/connect.sh</code>
       is still running, then copy this code into the terminal:</p>
       <code>${code}</code>`);
  }
})();
</script>
</body>
</html>
